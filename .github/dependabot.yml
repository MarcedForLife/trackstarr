version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR a month for the lot: they are all bumped and reviewed together
    # anyway, and six separate PRs for the same CI run is just noise.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # There are no runtime dependencies; this is the dev group in uv.lock.
  # Grouped for the same reason, and because a ruff bump is one lint run.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]
