version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR a month for the lot; they are reviewed together anyway.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # The UI's lockfile, which the Dockerfile and the ci web job install from.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]

  # The dev group in uv.lock, plus cryptography.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]
