name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the Alpine image actually runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ubuntu-latest ships ffmpeg, but pin the expectation explicitly so a
      # runner image change surfaces here rather than as skipped tests.
      - name: Check ffmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only — publishing is publish.yml's job. This exists so a broken
      # Dockerfile fails the PR rather than the release.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: trackstarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm trackstarr:ci --version
          docker run --rm trackstarr:ci plan --help

      # The matrix above runs against ubuntu-latest's ffmpeg, which is older
      # than the one we ship and silently drops per-stream MP4 titles, so the
      # tests needing them skip there. This is what actually exercises them,
      # against the exact ffmpeg and Python that users get. -rs reports the
      # skips so a capability quietly disappearing is visible in the log.
      - name: Test inside the image
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/tests:/w/tests:ro" \
            -v "$PWD/pyproject.toml:/w/pyproject.toml:ro" \
            -w /w trackstarr:ci -c '
              apk add --no-cache py3-pytest >/dev/null
              pytest -q -p no:cacheprovider -rs
            ' 2>&1 | tee image-tests.log

      - name: Fail if the image cannot round-trip MP4 titles
        run: |
          # A skip here means the shipped ffmpeg regressed, which the matrix
          # cannot see: it skips these for its own reasons and stays green.
          if grep -q "drops per-stream titles in MP4" image-tests.log; then
            echo "::error::the shipped image skipped the MP4 title tests"
            exit 1
          fi
