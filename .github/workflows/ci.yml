name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what the Alpine image actually runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ubuntu-latest ships ffmpeg, but pin the expectation explicitly so a
      # runner image change surfaces here rather than as skipped tests.
      - name: Check ffmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only — publishing is publish.yml's job. This exists so a broken
      # Dockerfile fails the PR rather than the release.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: trackstarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm trackstarr:ci --version
          docker run --rm trackstarr:ci plan --help
