name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  # Publish calls this, so a release runs the same checks a pull request does.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name, so a run called from Publish gets its
# own group and cannot cancel the CI guarding another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Astral publishes no floating major tag past v7. Dependabot bumps it.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # uv.lock pins ruff, so this is the same lint that ran locally.
      - run: uv run --locked ruff check --output-format=github
      - run: uv run --locked ruff format --check --diff
      # Paths and settings come from [tool.mypy], so local and CI agree.
      - run: uv run --locked mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The one version requires-python allows and the Alpine image ships.
          # Raise both together.
          python-version: "3.14"
          enable-cache: true

      # Ubuntu packages ffmpeg 6.1, which drops the per-stream MP4 titles two
      # tests need, so take the release branch Alpine ships. Each binary is
      # checked with a case so a missing one is a named failure. SERIES appears
      # once, so a bump cannot leave the check behind.
      - name: Install ffmpeg
        env:
          SERIES: n8.1
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-$SERIES-latest-linux64-gpl-${SERIES#n}.tar.xz"
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin \
            --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          for binary in ffmpeg ffprobe; do
            version=$("$binary" -version | head -1)
            echo "$version"
            case "$version" in
              *"version $SERIES."*) ;;
              *) echo "::error::expected $binary $SERIES on the runner, got: ${version:-nothing}"
                 exit 1 ;;
            esac
          done

      # For the in-place tag edits. Ubuntu's package is recent enough: the
      # commentary flag arrived in v50.
      - name: Install mkvtoolnix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mkvtoolnix
          mkvpropedit --version

      # --locked fails rather than resolving, so an unlocked pyproject edit is
      # caught here.
      - run: uv sync --locked
      # --cov enforces pyproject's fail_under. The suite refuses to start
      # without ffmpeg, so nothing skips past a broken install.
      - run: uv run pytest -v --cov

  # `vite build` type-checks nothing, so without this job a svelte-check or
  # lint failure ships in a green image.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version the Dockerfile builds with. Raise both together.
          node-version: 26
          cache: npm
          # Resolved from the repo root, not the working-directory.
          cache-dependency-path: web/package-lock.json

      # ci, so an unlocked package.json edit fails here.
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Same build the image does, minutes earlier and without Docker.
      - run: npm run build
      # And the demo's, so a change to the pages cannot break the one build
      # nothing else runs. See .github/workflows/demo.yml.
      - run: npm run build:demo

  # One entry per published architecture, or an amd64-only image could become
  # :latest for arm64. Native runners, since the integration tests encode real
  # video; the fallback is setup-qemu-action on ubuntu-latest.
  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only, so a broken Dockerfile fails the PR rather than the release.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: trackstarr:ci
          # Scoped per platform, or the two jobs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test the image
        run: |
          docker run --rm trackstarr:ci --version
          docker run --rm trackstarr:ci plan --help

      # The suite again against Alpine's own ffmpeg inside the shipped image, on
      # both architectures, where a packaging difference would show. --user root
      # only to install pytest; the smoke test above runs as the image's user.
      - name: Test inside the image
        run: |
          docker run --rm --entrypoint sh --user root \
            -v "$PWD/tests:/w/tests:ro" \
            -v "$PWD/web/src/fixtures:/w/web/src/fixtures:ro" \
            -v "$PWD/pyproject.toml:/w/pyproject.toml:ro" \
            -w /w trackstarr:ci -c '
              apk add --no-cache py3-pytest >/dev/null
              pytest -q -p no:cacheprovider
            '
