name: Publish

# Runs on the tag the Release workflow dispatches; the manual trigger rebuilds
# an image without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# GITHUB_TOKEN with packages:write is all GHCR needs; no PAT.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The release tag is cut without waiting for CI, so run it here.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Only a tag moves :latest; a manual dispatch pushes its sha tag.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Both halves were built and tested natively in the ci job; QEMU is
          # only needed because one manifest must be built on one runner.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The scopes ci.yml's docker matrix just filled natively. Read-only: a
          # monthly release cannot keep its own scope warm past the 7-day
          # eviction.
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
