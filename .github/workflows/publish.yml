name: Publish

# Runs on the tag the Release workflow dispatches; the manual trigger exists
# for rebuilding an image without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# GITHUB_TOKEN with packages:write is all GHCR needs. There is no PAT to
# create, store or rotate.
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The release tag is cut from develop without waiting for CI, so run it here:
  # a broken release must not become :latest.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Only a tag moves :latest. A manual dispatch off a branch still
            # rebuilds and pushes its sha tag, but cannot make develop latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Both halves have already been built and run the full suite on
          # their own native runner in the ci job above. QEMU is needed here
          # only because one manifest has to be built on one runner, so
          # nothing is validated for the first time under it.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The scopes ci.yml's docker matrix writes, which it has just filled
          # natively for this commit; on the default scope, which only this job
          # touches, both halves rebuild from cold under QEMU. Read-only for
          # the same reason: a monthly release cannot keep a scope of its own
          # warm past the 7-day eviction, so writing one buys nothing.
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
